<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porto IA — Assistente de Corretores</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0f4f8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #003087 0%, #0050b3 100%);
      color: white;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    .header-logo {
      width: 40px;
      height: 40px;
      background: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .header-title { flex: 1; }

    .header-title h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-title p {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 1px;
    }

    .header-badge {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    /* Contador semanal no header */
    .header-counter {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 5px 12px;
      min-width: 64px;
      cursor: default;
    }

    .header-counter .counter-num {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .header-counter .counter-label {
      font-size: 9px;
      opacity: 0.75;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    /* Tabs */
    .tabs-bar {
      background: white;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .tabs-bar::-webkit-scrollbar { height: 0; }

    .tab-btn {
      padding: 14px 20px;
      font-size: 13px;
      font-weight: 500;
      color: #718096;
      border: none;
      border-bottom: 3px solid transparent;
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: inherit;
      margin-bottom: -2px;
    }

    .tab-btn:hover { color: #003087; }

    .tab-btn.active {
      color: #003087;
      border-bottom-color: #003087;
      font-weight: 700;
    }

    /* Chat Container */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
      overflow: hidden;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 3px; }

    /* Welcome Card */
    .welcome-card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }

    .welcome-icon { font-size: 44px; margin-bottom: 12px; }

    .welcome-card h2 {
      font-size: 20px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 6px;
    }

    .welcome-card p {
      color: #718096;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .quick-questions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .quick-btn {
      background: #ebf4ff;
      border: 1px solid #bee3f8;
      color: #2b6cb0;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      text-align: left;
    }

    .quick-btn:hover {
      background: #003087;
      color: white;
      border-color: #003087;
      transform: translateY(-1px);
    }

    /* Aba 4 — Aumente Suas Vendas (conteudo editorial) */
    .vendas-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .vendas-section-title {
      font-size: 13px;
      font-weight: 700;
      color: #003087;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid #ebf4ff;
      padding-bottom: 8px;
      margin-bottom: 4px;
    }

    .vendas-intro {
      font-size: 14px;
      color: #4a5568;
      line-height: 1.6;
    }

    /* Ancoragem de preco */
    .price-anchor {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .price-card {
      flex: 1;
      min-width: 140px;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 2px solid transparent;
    }

    .price-card.basico {
      background: #f7fafc;
      border-color: #e2e8f0;
    }

    .price-card.recomendado {
      background: #ebf8ff;
      border-color: #003087;
      position: relative;
    }

    .price-card.premium {
      background: #fffbeb;
      border-color: #f6ad55;
    }

    .price-badge {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: #003087;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .price-label {
      font-size: 12px;
      font-weight: 700;
      color: #718096;
      margin-bottom: 4px;
    }

    .price-name {
      font-size: 15px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 8px;
    }

    .price-features {
      font-size: 12px;
      color: #4a5568;
      line-height: 1.7;
      text-align: left;
    }

    /* Cross-selling */
    .cross-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cross-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 14px;
      color: #4a5568;
      line-height: 1.5;
    }

    .cross-list li .icon {
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Perguntas magicas */
    .magic-questions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .magic-q {
      background: #f7fafc;
      border-left: 3px solid #003087;
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      font-size: 13px;
      color: #2d3748;
      line-height: 1.5;
      font-style: italic;
    }

    /* Urgencia */
    .urgencia-box {
      background: #fff5f5;
      border: 1px solid #fed7d7;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      color: #742a2a;
      line-height: 1.6;
    }

    .urgencia-box strong { color: #c53030; }

    /* Message Bubbles */
    .message {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      align-self: flex-start;
    }

    .message.user .message-avatar {
      background: #003087;
      color: white;
      font-size: 14px;
      font-weight: 700;
    }

    .message.ai .message-avatar {
      background: linear-gradient(135deg, #003087, #0050b3);
      color: white;
      font-size: 18px;
    }

    .message-content { max-width: 75%; }

    .message.user .message-content {
      align-items: flex-end;
      display: flex;
      flex-direction: column;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .message.user .bubble {
      background: #003087;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.ai .bubble {
      background: white;
      color: #1a202c;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }

    .bubble strong { font-weight: 700; }
    .bubble em { font-style: italic; }
    .bubble ul { padding-left: 20px; margin: 8px 0; }
    .bubble ol { padding-left: 20px; margin: 8px 0; }
    .bubble li { margin-bottom: 4px; }
    .bubble p { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; color: #003087; }
    .bubble code { background: #f7fafc; padding: 2px 6px; border-radius: 4px; font-size: 13px; }

    /* Tabelas dentro do bubble */
    .bubble table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin: 10px 0;
      overflow-x: auto;
      display: block;
    }

    .bubble thead th {
      background: #003087;
      color: white;
      padding: 8px 12px;
      text-align: left;
      font-weight: 700;
      white-space: nowrap;
      font-size: 12px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      border-bottom: 2px solid #001f5c;
    }

    .bubble thead th:first-child {
      border-radius: 4px 0 0 0;
    }

    .bubble thead th:last-child {
      border-radius: 0 4px 0 0;
    }

    .bubble tbody td:first-child {
      font-weight: 600;
      color: #1a202c;
      background: #f0f4fa;
    }

    .bubble tbody tr:nth-child(even) td:first-child {
      background: #e8eef8;
    }

    .bubble tbody td {
      padding: 6px 10px;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: top;
      line-height: 1.4;
    }

    .bubble tbody tr:nth-child(even) td { background: #f7fafc; }
    .bubble tbody tr:hover td { background: #ebf4ff; }

    /* Sources — fonte visivel abaixo de cada resposta */
    .sources {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding-top: 6px;
      border-top: 1px solid #f0f0f0;
    }

    .sources-label {
      width: 100%;
      font-size: 10px;
      color: #a0aec0;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .source-tag {
      background: #f1f5f9;
      color: #475569;
      padding: 3px 9px;
      font-size: 11px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-style: normal;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .source-tag:hover {
      background: #e2e8f0;
      color: #1e293b;
    }

    /* Typing indicator */
    .typing {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 12px 16px;
      background: white;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
      width: fit-content;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: #003087;
      border-radius: 50%;
      animation: typing 1.2s infinite;
      opacity: 0.4;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { opacity: 0.4; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-4px); }
    }

    /* Input Area */
    .input-area {
      background: white;
      border-top: 1px solid #e2e8f0;
      padding: 16px;
      flex-shrink: 0;
    }

    .input-area.hidden { display: none; }

    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 8px 8px 8px 16px;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: #003087;
      background: white;
    }

    #userInput {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      resize: none;
      max-height: 120px;
      min-height: 24px;
      color: #1a202c;
      line-height: 1.5;
    }

    #userInput::placeholder { color: #a0aec0; }

    .send-btn {
      width: 40px;
      height: 40px;
      background: #003087;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      background: #0050b3;
      transform: scale(1.05);
    }

    .send-btn:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    .send-btn svg { width: 18px; height: 18px; }

    /* Botões de ícone (mic, clipe) */
    .icon-btn {
      width: 36px;
      height: 36px;
      background: transparent;
      border: none;
      border-radius: 10px;
      color: #718096;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      padding: 0;
    }

    .icon-btn svg { width: 18px; height: 18px; }

    .icon-btn:hover {
      background: #f0f4f8;
      color: #003087;
    }

    .icon-btn.mic-active {
      color: #e53e3e;
      animation: mic-pulse 1s infinite;
    }

    @keyframes mic-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }

    /* Barra de anexo */
    .attach-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ebf4ff;
      border: 1px solid #bee3f8;
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 8px;
    }

    .attach-preview {
      flex: 1;
      font-size: 13px;
      color: #2b6cb0;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .attach-preview img {
      height: 40px;
      border-radius: 6px;
      vertical-align: middle;
      margin-right: 8px;
    }

    .attach-remove {
      background: transparent;
      border: none;
      color: #718096;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .attach-remove:hover { background: #fed7d7; color: #c53030; }

    /* Botão de play nas respostas */
    .tts-btn {
      background: transparent;
      border: none;
      color: #a0aec0;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.2s;
      margin-left: 2px;
      vertical-align: middle;
    }

    .tts-btn:hover { color: #003087; }
    .tts-btn.playing { color: #e53e3e; }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: #a0aec0;
      margin-top: 8px;
    }

    .disclaimer {
      background: #fffbeb;
      border: 1px solid #fbd38d;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: #744210;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-logo">🚗</div>
    <div class="header-title">
      <h1>Porto IA</h1>
      <p>Assistente de Corretores — Seguro Auto</p>
    </div>
    <div class="header-counter" title="Total de dúvidas respondidas nesta semana (reseta toda segunda-feira)">
      <span class="counter-num" id="weeklyCount">–</span>
      <span class="counter-label">dúvidas / semana</span>
    </div>
    <div class="header-badge">Beta</div>
  </div>

  <!-- Barra de abas -->
  <div class="tabs-bar">
    <button class="tab-btn active" onclick="switchTab('consulta', this)">🔍 Consulta Rápida</button>
    <button class="tab-btn" onclick="switchTab('campanhas', this)">📣 Campanhas</button>
    <button class="tab-btn" onclick="switchTab('comparativo', this)">📊 Comparativo de Assistências</button>
    <button class="tab-btn" onclick="switchTab('vendas', this)">💡 Aumente Suas Vendas</button>
  </div>

  <!-- Container principal do chat -->
  <div class="chat-container">
    <div class="messages" id="messages">
      <!-- Welcome card dinamico por aba -->
      <div class="welcome-card" id="welcomeCard"></div>
    </div>

    <!-- Input (escondido na aba Vendas) -->
    <div class="input-area" id="inputArea">

      <!-- Barra de anexo (aparece quando há arquivo) -->
      <div class="attach-bar" id="attachBar" style="display:none">
        <div class="attach-preview" id="attachPreview"></div>
        <button class="attach-remove" onclick="removeAttach()" title="Remover anexo">✕</button>
      </div>

      <div class="input-wrapper">
        <!-- Botão de clipe (PDF / imagem) -->
        <button class="icon-btn" id="attachBtn" onclick="triggerAttach()" title="Anexar PDF ou imagem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.41 17.41a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <input type="file" id="fileInput" accept=".pdf,.docx,.jpg,.jpeg,.png" style="display:none" onchange="handleFileAttach(event)">

        <textarea
          id="userInput"
          placeholder="Pergunte sobre coberturas, exclusões, sinistros..."
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>

        <!-- Botão de microfone -->
        <button class="icon-btn" id="micBtn" onclick="toggleMic()" title="Falar" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>

        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Enviar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter para enviar • Shift+Enter para nova linha</div>
      <div class="disclaimer">
        ⚠️ As respostas são baseadas nas Condições Gerais oficiais. A avaliação de cobertura de casos específicos é responsabilidade exclusiva da seguradora.
      </div>
    </div>
  </div>

  <script>
    let historico = [];
    let isLoading = false;
    let abaAtual = 'consulta';

    // Configuracao de cada aba
    const abas = {
      consulta: {
        icon: '🤖',
        titulo: 'Olá, Corretor!',
        descricao: 'Tire suas dúvidas sobre coberturas, condições gerais, exclusões e muito mais do Seguro Auto Porto Seguro.',
        perguntas: [
          'Qual é o valor da franquia no Auto Porto?',
          'O seguro cobre danos causados por enchente?',
          'Condutor não proprietário pode usar o carro segurado?',
          'Como funciona a carência no seguro auto?',
          'Quais são as principais exclusões de cobertura?'
        ],
        placeholder: 'Pergunte sobre coberturas, exclusões, sinistros...'
      },
      campanhas: {
        icon: '📣',
        titulo: 'Campanhas Ativas',
        descricao: 'Consulte informações sobre campanhas, comissões e bonificações em vigor para o Seguro Auto Porto Seguro.',
        perguntas: [
          'Quais campanhas de vendas estão ativas agora?',
          'Qual é a comissão vigente para Auto Porto?',
          'Quando vence a campanha atual?',
          'Como funciona a bonificação por volume de vendas?'
        ],
        placeholder: 'Pergunte sobre campanhas, comissões, bonificações...'
      },
      comparativo: {
        icon: '📊',
        titulo: 'Comparativo de Assistências',
        descricao: 'Compare coberturas de assistência 24h entre os produtos Auto Porto, Auto Azul e Auto Proteção Combinada.',
        perguntas: [
          'Qual produto oferece guincho ilimitado?',

    function parseMarkdown(text) {
      // Processar tabelas markdown primeiro (antes de qualquer outra transformacao)
      text = text.replace(/(?:^|\n)((?:\|[^\n]+\|\n?)+)/gm, function(match, tableBlock) {
        const rows = tableBlock.trim().split('\n').filter(r => r.trim());
        if (rows.length < 2) return match;

        // Linha separadora (| --- | --- |)
        const isSep = r => /^\|[\s\-:|]+\|/.test(r);
        let headerRow = null;
        let bodyRows = [];

        if (rows.length >= 2 && isSep(rows[1])) {
          headerRow = rows[0];
          bodyRows = rows.slice(2);
        } else {
          bodyRows = rows;
        }

        const parseCells = row => row.split('|').slice(1, -1).map(c => c.trim());

        let html = '<table>';
        if (headerRow) {
          const cells = parseCells(headerRow);
          html += '<thead><tr>' + cells.map(c =>
            '<th>' + c.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') + '</th>'
          ).join('') + '</tr></thead>';
        }
        if (bodyRows.length) {
          html += '<tbody>';
          for (const row of bodyRows) {
            if (isSep(row)) continue;
            const cells = parseCells(row);
            html += '<tr>' + cells.map(c =>
              '<td>' + c
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/✅/g, '<span style="color:#22c55e">✅</span>')
                .replace(/❌/g, '<span style="color:#ef4444">❌</span>')
                .replace(/⚠️/g, '<span style="color:#f59e0b">⚠️</span>')
              + '</td>'
            ).join('') + '</tr>';
          }
          html += '</tbody>';
        }
        html += '</table>';
        return '\n' + html + '\n';
      });

      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/### (.*?)(?:\n|$)/g, '<h3>$1</h3>')
        .replace(/## (.*?)(?:\n|$)/g, '<h3>$1</h3>')
        .replace(/^- (.*?)(?:\n|$)/gm, '<li>$1</li>')
        .replace(/^(\d+)\. (.*?)(?:\n|$)/gm, '<li>$2</li>')
        .replace(/(<li>.*?<\/li>)\n?(<li>)/g, '$1$2')
        .replace(/(<li>.*?<\/li>)+/g, '<ul>$&</ul>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .split('\n\n')
        .map(p => p.trim() ? (p.startsWith('<') ? p : `<p>${p.replace(/\n/g, '<br>')}</p>`) : '')
        .join('');
    }

    function updateWeeklyCount(n) {
      const el = document.getElementById('weeklyCount');
      if (el && n !== undefined && n !== null) el.textContent = n;
    }

    async function loadInitialCounter() {
      try {
        const token = localStorage.getItem('session_token') || '';
        const r = await fetch('/api/counter', {
          headers: token ? { 'X-Session-Token': token } : {}
        });
        if (r.ok) {
          const d = await r.json();
          updateWeeklyCount(d.weekly_count);
        }
      } catch(e) { /* silencioso */ }
    }

    function addMessage(tipo, texto, fontes) {
      const messagesEl = document.getElementById('messages');
      const welcomeCard = document.getElementById('welcomeCard');
      if (welcomeCard) welcomeCard.remove();

      const div = document.createElement('div');
      div.className = `message ${tipo}`;

      if (tipo === 'user') {
        div.innerHTML = `
          <div class="message-avatar">CL</div>
          <div class="message-content">
            <div class="bubble">${texto.replace(/\n/g, '<br>')}</div>
          </div>
        `;
      } else {
        const sourcesHtml = fontes && fontes.length
          ? `<div class="sources"><span class="sources-label">📄 Fontes</span>${fontes.map(f => `<span class="source-tag">${f}</span>`).join('')}</div>`
          : '';
        // Botão TTS — só mostra se speechSynthesis disponível
        const ttsHtml = window.speechSynthesis
          ? `<button class="tts-btn" title="Ouvir resposta" onclick="speakText(this.closest('.message-content').querySelector('.bubble').__rawText || this.closest('.message-content').querySelector('.bubble').innerText, this)">🔊</button>`
          : '';
        div.innerHTML = `
          <div class="message-avatar">P</div>
          <div class="message-content">
            <div class="bubble">${parseMarkdown(texto)}</div>
            <div style="display:flex;align-items:center;gap:4px;margin-top:2px">
              ${ttsHtml}
              ${sourcesHtml}
            </div>
          </div>
        `;
        // Guarda texto bruto para o TTS ler sem markdown
        const bubble = div.querySelector('.bubble');
        if (bubble) bubble.__rawText = texto;
      }

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function addTyping() {
      const messagesEl = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message ai';
      div.id = 'typingIndicator';
      div.innerHTML = `
        <div class="message-avatar">P</div>
        <div class="message-content">
          <div class="typing">
            <span></span><span></span><span></span>
          </div>
        </div>

    function removeTyping() {
      const t = document.getElementById('typingIndicator');
      if (t) t.remove();
    }

    // ================================================================
    // ESTADO DE ANEXO (F3/F4)
    // ================================================================
    let attachedFile = null;      // { type: 'pdf'|'image', name, data, mimeType }

    function triggerAttach() {
      document.getElementById('fileInput').click();
    }

    function removeAttach() {
      attachedFile = null;
      document.getElementById('attachBar').style.display = 'none';
      document.getElementById('attachPreview').innerHTML = '';
      document.getElementById('fileInput').value = '';
    }

    function handleFileAttach(event) {
      const file = event.target.files[0];
      if (!file) return;

      const name = file.name;
      const ext = name.split('.').pop().toLowerCase();
      const isImage = ['jpg','jpeg','png'].includes(ext);
      const isPdf = ext === 'pdf';
      const isDocx = ext === 'docx';

      if (!isImage && !isPdf && !isDocx) {
        alert('Formato não suportado. Use PDF, DOCX, JPG ou PNG.');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;
        const base64 = dataUrl.split(',')[1];

        if (isImage) {
          attachedFile = { type: 'image', name, data: base64, mimeType: file.type };
          const preview = document.getElementById('attachPreview');
          preview.innerHTML = `<img src="${dataUrl}" alt="${name}"> <strong>${name}</strong>`;
        } else {
          attachedFile = { type: 'doc', name, data: base64, mimeType: file.type, ext };
          document.getElementById('attachPreview').innerHTML = `📄 <strong>${name}</strong>`;
        }

        document.getElementById('attachBar').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    // ================================================================
    // F1 — MICROFONE (Web Speech API)
    // ================================================================
    let recognition = null;
    let micActive = false;

    (function initMic() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return; // Chrome only — esconde silenciosamente

      const micBtn = document.getElementById('micBtn');
      micBtn.style.display = 'flex';

      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onresult = function(event) {
        const input = document.getElementById('userInput');
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        input.value = final || interim;
        autoResize(input);
      };

      recognition.onend = function() {
        micActive = false;
        document.getElementById('micBtn').classList.remove('mic-active');
        // Envia automaticamente se há texto
        const val = document.getElementById('userInput').value.trim();
        if (val) sendMessage();
      };

      recognition.onerror = function(e) {
        micActive = false;
        document.getElementById('micBtn').classList.remove('mic-active');
        if (e.error !== 'no-speech' && e.error !== 'aborted') {
          console.warn('Mic error:', e.error);
        }
      };
    })();

    function toggleMic() {
      if (!recognition) return;
      if (micActive) {
        recognition.stop();
        micActive = false;
        document.getElementById('micBtn').classList.remove('mic-active');
      } else {
        recognition.start();
        micActive = true;
        document.getElementById('micBtn').classList.add('mic-active');
        document.getElementById('userInput').value = '';
        document.getElementById('userInput').placeholder = '🎙️ Ouvindo...';
      }
    }

    // ================================================================
    // F2 — LEITURA EM VOZ ALTA (Web Speech API — TTS)
    // ================================================================
    let currentUtterance = null;
    let currentTtsBtn = null;

    function speakText(text, btn) {
      if (!window.speechSynthesis) return;

      // Se já está falando esse botão, para
      if (currentTtsBtn === btn && window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        btn.textContent = '🔊';
        btn.classList.remove('playing');
        currentTtsBtn = null;
        currentUtterance = null;
        return;
      }

      // Para qualquer leitura anterior
      window.speechSynthesis.cancel();
      if (currentTtsBtn) {
        currentTtsBtn.textContent = '🔊';
        currentTtsBtn.classList.remove('playing');
      }

      // Remove markdown simples para leitura limpa
      const clean = text
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/\*(.*?)\*/g, '$1')
        .replace(/#{1,3} /g, '')
        .replace(/\|[^\n]+\|/g, '') // remove linhas de tabela
        .replace(/[-•]/g, '')
        .replace(/\n+/g, '. ')
        .trim();

      const utter = new SpeechSynthesisUtterance(clean);
      utter.lang = 'pt-BR';
      utter.rate = 1.0;
      utter.pitch = 1.0;

      // Preferir voz feminina
      const voices = window.speechSynthesis.getVoices();
      const femVoice = voices.find(v =>
        v.lang.startsWith('pt') && (v.name.includes('female') || v.name.includes('Maria') ||
        v.name.includes('Luciana') || v.name.includes('Google') && v.name.includes('BR'))
      );
      if (femVoice) utter.voice = femVoice;

      utter.onend = function() {
        btn.textContent = '🔊';
        btn.classList.remove('playing');
        currentTtsBtn = null;
      };

      utter.onerror = function() {
        btn.textContent = '🔊';
        btn.classList.remove('playing');
        currentTtsBtn = null;
      };

      currentUtterance = utter;
      currentTtsBtn = btn;
      btn.textContent = '⏹';
      btn.classList.add('playing');
      window.speechSynthesis.speak(utter);
    }

    // Pré-carrega vozes assim que disponível
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // ================================================================
    // SEND MESSAGE — com suporte a anexos (F3/F4)
    // ================================================================
    async function sendMessage() {
      if (isLoading) return;

      const input = document.getElementById('userInput');
      let pergunta = input.value.trim();

      // Permite envio só com anexo (sem texto)
      if (!pergunta && !attachedFile) return;
      if (!pergunta) pergunta = attachedFile.name;

      if (micActive && recognition) {
        recognition.stop();
        micActive = false;
        document.getElementById('micBtn').classList.remove('mic-active');
      }
      input.placeholder = 'Pergunte sobre coberturas, exclusões, sinistros...';

      isLoading = true;
      input.value = '';
      input.style.height = 'auto';
      document.getElementById('sendBtn').disabled = true;

      // Montar preview da mensagem do usuário
      let userLabel = pergunta;
      if (attachedFile) {
        userLabel = attachedFile.type === 'image'
          ? `🖼️ ${attachedFile.name}\n${pergunta !== attachedFile.name ? pergunta : ''}`
          : `📄 ${attachedFile.name}\n${pergunta !== attachedFile.name ? pergunta : ''}`;
      }

      addMessage('user', userLabel.trim());
      addTyping();

      const token = localStorage.getItem('session_token') || '';

      // Payload base
      const payload = {
        message: pergunta,
        history: historico.map(h => ([
          { role: 'user', content: h.pergunta },
          { role: 'assistant', content: h.resposta }
        ])).flat()
      };

      // Adiciona anexo se houver
      if (attachedFile) {
        payload.attachment = {
          type: attachedFile.type,
          name: attachedFile.name,
          data: attachedFile.data,
          mime_type: attachedFile.mimeType,
          ext: attachedFile.ext || null
        };
      }

      const fileSnap = attachedFile ? { ...attachedFile } : null;
      removeAttach();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Session-Token': token
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        removeTyping();

        if (response.ok) {
          addMessage('ai', data.answer, data.sources);
          if (data.weekly_count) updateWeeklyCount(data.weekly_count);
          historico.push({ pergunta: userLabel.trim(), resposta: data.answer });
          if (historico.length > 6) historico = historico.slice(-6);
        } else {
          addMessage('ai', `❌ Erro: ${data.detail || 'Tente novamente.'}`, []);
        }
      } catch (err) {
        removeTyping();
        addMessage('ai', '❌ Erro de conexão com o servidor. Verifique se a API está rodando.', []);
      }

      isLoading = false;
      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }

    // Inicializa com a aba Consulta Rapida
    renderWelcome('consulta');
    loadInitialCounter();
  </script>
